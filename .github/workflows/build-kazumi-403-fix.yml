name: Build Kazumi 403 manual verification fix

on:
  push:
    branches:
      - kazumi-403-manual-verify-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          ref: kazumi-403-manual-verify-build

      - name: Checkout Kazumi 2.3.0
        uses: actions/checkout@v4
        with:
          repository: Predidit/Kazumi
          ref: '2.3.0'
          path: Kazumi

      - name: Apply 403 manual verification patch
        run: python3 .github/scripts/patch_kazumi.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: Kazumi/pubspec.yaml
          cache: true

      - name: Install Linux build prerequisites used by Android dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev libasound2-dev

      - name: Get Flutter dependencies
        working-directory: Kazumi
        run: flutter pub get

      - name: Remove ELF build id for JNI dependency
        shell: bash
        run: |
          JNI_CMAKE=$(find "${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev" -path '*/jni-*/src/CMakeLists.txt' | head -n 1)
          if [ -n "$JNI_CMAKE" ]; then
            sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$JNI_CMAKE"
          fi

      - name: Analyze patched files
        working-directory: Kazumi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/plugin/rule_engine.dart lib/pages/info/source_captcha_flow.dart lib/pages/plugin_editor/plugin_test_page.dart

      - name: Build Android arm64 APK
        working-directory: Kazumi
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name=2.3.0-403fix \
            --build-number=20301 \
            --dart-define=DANDANAPI_APPID= \
            --dart-define=DANDANAPI_KEY= \
            --dart-define=KAZUMI_APPID= \
            --dart-define=KAZUMI_KEY=

      - name: Rename APK
        run: cp Kazumi/build/app/outputs/flutter-apk/app-release.apk Kazumi_android_2.3.0_403fix_arm64.apk

      - name: APK SHA-256
        run: sha256sum Kazumi_android_2.3.0_403fix_arm64.apk | tee Kazumi_android_2.3.0_403fix_arm64.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazumi_android_2.3.0_403fix_arm64
          path: |
            Kazumi_android_2.3.0_403fix_arm64.apk
            Kazumi_android_2.3.0_403fix_arm64.apk.sha256
          retention-days: 7
